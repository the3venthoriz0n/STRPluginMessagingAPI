name: Release

# Pushing a tag like v0.10.2 (the tagged commit must be on main, or the run stops) is all a release needs: the tag IS the version.
# The run stamps it into CMakeLists.txt, build-vortex.ps1, build-test-vortex.ps1, package/fomod/info.xml and the two
# "SKSEPlugin_Load entered" log strings, builds the DLLs for BOTH Skyrim runtimes (1.6.1170 and 1.7.104) on Windows, packages
# the FOMOD archive dist/STRPluginMessagingAPI_<version>.zip (same layout as build-vortex.ps1 and windows-build.yml) and
# creates a GitHub release with it.
#
# The runner builds with the Visual Studio generator, like windows-build.yml. build-vortex.ps1 itself is NOT used on the runner:
# it needs Visual Studio 18 and a Ninja path that only exist on the maintainer's PC.
#
# A test tag such as v0.10.2-test1 builds the same zip and makes a GitHub PRE-RELEASE with it, so every change can get a kept
# build without publishing it.
#
# There is no Nexus Mods step and no version bump commit: this repo has no Nexus page, so the stamped version numbers live
# only in the tagged build (the numbers in the repo are not edited by the workflow).
#
# Run manually from the Actions tab to build and package without releasing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME is not on main; nothing was published." }

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $suffix = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)(?:-([0-9A-Za-z.]+))?$') {
              throw "Tag $env:GITHUB_REF_NAME must look like v1.2.3 (release) or v1.2.3-test1 (test build)"
            }
            $v = $Matches[1]
            if ($Matches[2]) { $suffix = $Matches[2] }
          } else {
            $text = [System.IO.File]::ReadAllText((Join-Path $PWD 'CMakeLists.txt'))
            $m = [regex]::Match($text, '(?s)project\(\s*STRPluginMessagingAPI\s+VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
            if (-not $m.Success) { throw "Could not read the version from CMakeLists.txt" }
            $v = $m.Groups[1].Value
          }
          $full = if ($suffix) { "$v-$suffix" } else { $v }
          "version=$v" >> $env:GITHUB_OUTPUT
          "full=$full" >> $env:GITHUB_OUTPUT
          "test=$(if ($suffix) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Stamp the version into the sources
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          function Stamp([string]$path, [string]$pattern, [string]$replacement) {
            $text = [System.IO.File]::ReadAllText((Join-Path $PWD $path))
            $rx = [regex]$pattern
            if ($rx.Matches($text).Count -ne 1) { throw "Expected exactly one version match in $path" }
            [System.IO.File]::WriteAllText((Join-Path $PWD $path), $rx.Replace($text, $replacement))
            Write-Host "Stamped $path -> $v"
          }
          $num = '[0-9]+\.[0-9]+\.[0-9]+'
          Stamp 'CMakeLists.txt' "(VERSION )$num(\s+LANGUAGES CXX)" ('${1}' + $v + '${2}')
          Stamp 'build-vortex.ps1' "(\[string\]\`$Version = `")$num(`")" ('${1}' + $v + '${2}')
          Stamp 'build-test-vortex.ps1' "(\[string\]\`$Version = `")$num(`")" ('${1}' + $v + '${2}')
          Stamp 'package/fomod/info.xml' "(<Version MachineVersion=`")$num(`">)$num(</Version>)" ('${1}' + $v + '${2}' + $v + '${3}')
          Stamp 'src/STRPluginMessagingBridgeSKSE.cpp' "(STRPluginMessagingBridge v)$num(: SKSEPlugin_Load entered)" ('${1}' + $v + '${2}')
          Stamp 'src/STRPluginMessagingDiagnosticSKSE.cpp' "(STRPluginMessagingDiagnostic v)$num(: SKSEPlugin_Load entered)" ('${1}' + $v + '${2}')

      - name: Configure Skyrim 1.6.1170
        shell: pwsh
        run: cmake -S . -B build-16 -A x64 -DSTRPM_ENABLE_UDP_BACKEND=OFF -DSTRPM_BUILD_STR184_BRIDGE_PROBE=ON -DSTRPM_SKYRIM_RUNTIME=1.6.1170

      - name: Build Skyrim 1.6.1170
        shell: pwsh
        run: cmake --build build-16 --config Release --parallel

      - name: Configure Skyrim 1.7.104
        shell: pwsh
        run: cmake -S . -B build-17 -A x64 -DSTRPM_ENABLE_UDP_BACKEND=OFF -DSTRPM_BUILD_STR184_BRIDGE_PROBE=ON -DSTRPM_SKYRIM_RUNTIME=1.7.104

      - name: Build Skyrim 1.7.104
        shell: pwsh
        run: cmake --build build-17 --config Release --parallel

      # This repo has no automated tests; the builds and the archive entry check below are the gate.

      - name: Package
        id: package
        shell: pwsh
        run: |
          $zipName = "STRPluginMessagingAPI_${{ steps.ver.outputs.full }}.zip"
          $root = "artifact-release"
          $common = "$root/Common/SKSE/Plugins"
          $runtime16 = "$root/Runtime/Skyrim-1.6.1170/SKSE/Plugins"
          $runtime17 = "$root/Runtime/Skyrim-1.7.104/SKSE/Plugins"
          $serverResources = "$root/Server/SkyrimTogetherReborn/resources"
          foreach ($d in @($common, $runtime16, $runtime17, $serverResources, "dist")) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          foreach ($x in @("package/fomod/info.xml", "package/fomod/ModuleConfig.xml")) { [xml](Get-Content -LiteralPath $x -Raw) | Out-Null }
          Copy-Item "package/fomod" "$root/fomod" -Recurse -Force
          Copy-Item "package/Data/SKSE/Plugins/STRPluginMessagingAPI.ini" "$common/STRPluginMessagingAPI.ini"
          foreach ($pair in @(@("build-16", $runtime16), @("build-17", $runtime17))) {
            foreach ($dll in @("STRPluginMessagingAPI.dll", "STRPluginMessagingBridge.dll")) {
              $from = "$($pair[0])/Release/$dll"
              if (-not (Test-Path -LiteralPath $from -PathType Leaf)) { throw "Missing build output: $from" }
              Copy-Item $from "$($pair[1])/$dll"
            }
          }
          Copy-Item "extras/str-server-resources/strpm-chat-relay" $serverResources -Recurse -Force

          $zip = "dist/$zipName"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $zip))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            $required = @(
              "fomod/info.xml",
              "fomod/ModuleConfig.xml",
              "Common/SKSE/Plugins/STRPluginMessagingAPI.ini",
              "Runtime/Skyrim-1.6.1170/SKSE/Plugins/STRPluginMessagingAPI.dll",
              "Runtime/Skyrim-1.6.1170/SKSE/Plugins/STRPluginMessagingBridge.dll",
              "Runtime/Skyrim-1.7.104/SKSE/Plugins/STRPluginMessagingAPI.dll",
              "Runtime/Skyrim-1.7.104/SKSE/Plugins/STRPluginMessagingBridge.dll",
              "Server/SkyrimTogetherReborn/resources/strpm-chat-relay/main.lua",
              "Server/SkyrimTogetherReborn/resources/strpm-chat-relay/strpm-chat-relay.manifest"
            )
            foreach ($entry in $required) {
              if ($entries -notcontains $entry) { throw "Missing archive entry: $entry" }
            }
            if ($entries -match "STRPluginMessagingDiagnostic.dll") { throw "Diagnostic DLL must not be included in the public release archive." }
          } finally {
            $archive.Dispose()
          }

      - uses: actions/upload-artifact@v4
        with:
          name: STRPluginMessagingAPI_${{ steps.ver.outputs.full }}
          path: dist/STRPluginMessagingAPI_${{ steps.ver.outputs.full }}.zip

      - name: GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @()
          if ('${{ steps.ver.outputs.test }}' -eq 'true') { $extra += '--prerelease' }
          gh release create "$env:GITHUB_REF_NAME" "dist\STRPluginMessagingAPI_${{ steps.ver.outputs.full }}.zip" --generate-notes --title "STRPluginMessagingAPI_${{ steps.ver.outputs.full }}" @extra
